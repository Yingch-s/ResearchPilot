# ResearchPilot 改造：OpenAI 兼容协议模型接入（方舟/vLLM/compatible-mode）
researchpilot:
  model:
    api-key: ${LLM_API_KEY:}
    base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    model-name: ${LLM_MODEL:}
  kb:
    # ResearchPilot Phase B: 论文知识库摄取配置
    object-store-path: ${RP_OBJECT_STORE:./data/rp-objects}
    sidecar-base-url: ${RP_SIDECAR_URL:http://localhost:8100}
    es-index: ${RP_ES_INDEX:rp_chunks_v1}
    embed-dim: 1024
    embed-batch-size: 32
  research-budget:
    # ResearchPilot Phase E: 统一 Research Budget（诚实停止：预算耗尽 ≠ 证据充分）
    global-timeout-seconds: ${RP_BUDGET_TIMEOUT:360}
    max-loop-visits: ${RP_BUDGET_LOOPS:12}
    no-progress-rounds: ${RP_BUDGET_NO_PROGRESS:1}
    # V0.4 H2.2: 请求级超时（LLM 请求自身可执行的超时）
    llm-request-timeout-seconds: ${RP_LLM_TIMEOUT:120}
    finalization-reserve-seconds: ${RP_FINALIZE_RESERVE:60}

server:
  port: 8080
spring:
  config:
    import: optional:file:${RP_RUNTIME_CONFIG:./data/runtime.properties}
  # ResearchPilot 改造：embedding 暂用 DashScope（Phase B 切方舟/本地 bge-m3 时再调整）；
  # openai starter 只用 ChatModel，其余能力（embedding/语音/图像/审核）全部排除，
  # 避免与 dashscope 自动配置产生双 Bean 冲突或要求无谓的 api-key
  autoconfigure:
    exclude:
      - org.springframework.ai.model.openai.autoconfigure.OpenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioSpeechAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiAudioTranscriptionAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiImageAutoConfiguration
      - org.springframework.ai.model.openai.autoconfigure.OpenAiModerationAutoConfiguration
  # ResearchPilot Phase B: 业务真值库（PostgreSQL）+ 幂等 Schema 初始化
  datasource:
    url: ${RP_DB_URL:jdbc:postgresql://localhost:5433/researchpilot}
    username: ${RP_DB_USER:researchpilot}
    password: ${RP_DB_PASSWORD:researchpilot}
  sql:
    init:
      mode: always
      schema-locations: classpath:rp_schema.sql
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB
      enabled: true
      file-size-threshold: 1MB
  profiles:
    # LangFuse和可观测配置以及专业知识库配置
    include: observability, kb
  application:
    name: spring-ai-alibaba-deepresearch
  # Redis 配置
  data:
    redis:
      enabled: false
      host: localhost
      port: 6379
      password: ${REDIS-PASSWORD}
      timeout: 3000 # 连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms
  ai:
    # ResearchPilot 改造：openai starter 自动配置的模型 Bean 实际不被调用
    # （业务走 AgentModelsConfiguration 自建的 ChatModel），这里给 key 仅为让自动配置能实例化
    openai:
      api-key: ${LLM_API_KEY:}
      base-url: ${LLM_BASE_URL:https://api.deepseek.com}
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY:noop-key}
      base-url: https://dashscope.aliyuncs.com
      embedding:
        options:
          model: text-embedding-v1

    mcp:
      client:
        enabled: false
        type: ASYNC
    alibaba:
      toolcalling:
        baidu:
          search:
            enabled: true
        tavilysearch:
          api-key: ${TAVILY_API_KEY}
          enabled: true
        jinacrawler:
          enabled: false
          api-key: ${JINA_API_KEY}
        serpapi:
          api-key: ${SERPAPI_KEY}
          enabled: true
        aliyunaisearch:
          api-key: ${ALIYUN_AI_SEARCH_API_KEY}
          base-url: ${ALIYUN_AI_SEARCH_BASE_URL}
          enabled: true
        # 学术研究工具调用配置
        openalex:
          enabled: false
        # 旅游生活工具调用配置
        opentripmap:
          enabled: false
          api-key: ${OPENTRIPMAP_API_KEY}
        # 百科知识工具调用配置
        wikipedia:
          enabled: false
        # 数据分析工具调用配置
        worldbankdata:
          enabled: false
        googlescholar:
          enabled: false
      deepresearch:
        # 图执行的最大迭代次数
        max-iterations: 50
        # 定义项目可以使用的搜索引擎
        search-list:
          - tavily
          - aliyun
          - baidu
          - serpapi
        smart-agents:
          enabled: false
          search-platform-mapping:
            academic_research:
              primary: openalex
            lifestyle_travel:
              primary: opentripmap
            encyclopedia:
              primary: wikipedia
            data_analysis:
              primary: worldbankdata
            general_research:
              primary: tavily
        mcp:
          enabled: false
          config-location: classpath:mcp-config.json
        parallel-node-count:
          researcher: 4
          coder: 4
        rag:
          enabled: false
          # 可以设置为 'simple' 或 'elasticsearch'
          vector-store-type: simple
          data:
            # 启动时加载 classpath下data目录中的所有文件
            locations:
              - "classpath:/data/"
          # Elasticsearch配置
          #elasticsearch:
          #  uris: http://localhost:9200
          #  similarity-function: cosine

        # 报告导出路径配置
        export:
          path: ${AI_DEEPRESEARCH_EXPORT_PATH}
        reflection:
          enabled: true
          max-attempts: 1
        # 短期记忆配置
        short-term-memory:
          enabled: true
          # 会话记忆配置
          conversation-memory:
            # 最长保留会话长度
            max-messages: 100
          # 用户角色记忆配置
          user-role-memory:
            # 用户角色短期记忆引导模型生成的范围
            guide-scope: every
            # 判定需要更新记忆时相似度阈值，范围0~1，默认0.8
            update-similarity-threshold : 0.8
            # 参考历史用户提问的条数
            history-user-messages-num: 10
          # 记忆类型
          memory-type: in-memory



logging:
  level:
    com.alibaba.cloud.ai.example.deepresearch: debug

